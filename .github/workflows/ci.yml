name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild the client bundle
        run: node build.mjs

      - name: Asset QC
        # Runs after the rebuild so the assets/ copy it compares against is the
        # fresh one. Zero dependencies: the PNGs are decoded with node:zlib.
        run: node tools/asset-qc.mjs

      - name: The committed bundle must match the sources
        run: git diff --exit-code -- client.js

      - name: Unit tests
        # --test-force-exit: the pet owns timers, so the test runner would other-
        # wise stay alive until the job times out.
        run: node --test --test-force-exit test/companion.test.mjs
