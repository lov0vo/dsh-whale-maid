name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild the client bundle
        run: node build.mjs

      - name: The committed bundle must match the sources
        run: git diff --exit-code -- client.js

      - name: Unit tests
        run: node --test test/companion.test.mjs
